[package]
name = "moonveil"
version = "1.1.0"
edition = "2024"
description = "A moonlit anime idle RPG, written in Rust"
license = "MIT"

[dependencies]
macroquad = { version = "0.4.16", features = ["audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

